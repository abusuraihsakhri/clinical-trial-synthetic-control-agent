[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-synthetic-control-engine"
version = "2.0.0"
description = "SyntheticControl-Arm: Propensity Score & G-Computation Observational Matcher"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clinical-trial-synthetic-control-engine = "synthetic_control_arm.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clinical-trial-synthetic-control-engine"
Repository = "https://github.com/abusuraihsakhri/clinical-trial-synthetic-control-engine.git"
