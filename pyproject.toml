[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-synthetic-control-agent"
version = "2.1.0"
description = "Propensity-score matching and matched-cohort diagnostics for external-control analyses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.scripts]
clinical-trial-synthetic-control-agent = "synthetic_control_arm.cli:main"

[tool.setuptools.packages.find]
include = ["synthetic_control_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
