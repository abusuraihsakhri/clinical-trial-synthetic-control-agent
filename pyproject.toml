[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-synthetic-control-agent"
version = "2.0.0"
description = "Synthetic Control Arm: Propensity Score Matching & Survival Analysis Engine for Single-Arm Clinical Trials"
readme = "README.md"
authors = [{ name = "Clinical Computing Specialist" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clinical-trial-synthetic-control-agent = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
